name: Playwright YouTube CI Otomasyonu

on:
  push:
    branches: [ main ] # Her kod gonderdiginde otomatik test et
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik calistir
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  playwright-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Repodaki Kodlari Sanal Makineye Cek
        uses: actions/checkout@v4

      - name: 2. Node.js Ortamini Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Playwright ve Bagimliliklari Yukle
        run: npm install

      - name: 4. Chromium Tarayicisini Kur
        run: npx playwright install --with-deps chromium

      - name: 5. Playwright Testlerini Calistir
        run: npx playwright test

      - name: 6. Test Raporunu (HTML Report) Kaydet
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # Test gecse de kalsa da raporu kaydet!
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
